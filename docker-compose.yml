services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: careerquest
      POSTGRES_USER: careerquest
      POSTGRES_PASSWORD: careerquest
    ports:
      - "55432:5432"
    volumes:
      - careerquest_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerquest -d careerquest"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  careerquest_postgres:
